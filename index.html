    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mrs_tech_theme_mode');
          var isDark = saved !== 'light';
          if (isDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', isDark ? '#070b14' : '#f4f7fb');
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#f4f7fb] dark:bg-[#070b14] text-[#0f172a] dark:text-[#f1f5f9] antialiased selection:bg-blue-500/30 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var rawEntry = document.querySelector('script[src="/src/main.tsx"]');
        var viteClient = document.querySelector('script[src*="@vite/client"]');
        if (!rawEntry || viteClient) return;

        var p = window.location.pathname;
        if (p.indexOf('/dist/') !== -1 || p.indexOf('/docs/') !== -1) return;

        var dir = p.slice(-11) === '/index.html' ? p.slice(0, -10) : (p.charAt(p.length - 1) === '/' ? p : p + '/');
        var suffix = window.location.search + window.location.hash;

        fetch(dir + 'dist/index.html', { method: 'HEAD' })
          .then(function (r) {
            if (r.ok) {
              window.location.replace(dir + 'dist/' + suffix);
              return null;
            }
            return fetch(dir + 'docs/index.html', { method: 'HEAD' });
          })
          .then(function (r2) {
            if (r2 && r2.ok) {
              window.location.replace(dir + 'docs/' + suffix);
              return;
            }
            if (r2 !== null) {
              var root = document.getElementById('root');
              if (root && !root.innerHTML) {
                root.innerHTML =
                  '<main style="max-width:680px;margin:80px auto;padding:24px;font-family:Plus Jakarta Sans,sans-serif;">' +
                  '<h1 style="font-size:2.5rem;font-weight:800;margin-bottom:8px;">M R S</h1>' +
                  '<p style="opacity:0.85;margin-bottom:20px;">Available for Remote IT Support, Virtual Assistance &amp; Administrative Work</p>' +
                  '<p style="font-size:14px;opacity:0.75;margin-bottom:20px;">Static build bundle (dist/ or docs/) was not found at this branch root. Set GitHub Pages Source to <strong>GitHub Actions</strong> or <strong>main /docs</strong> to serve the full interactive application.</p>' +
                  '<a href="https://mrxshahin.ai.studio/" style="display:inline-block;padding:10px 18px;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;text-decoration:none;">Visit mrxshahin.ai.studio</a>' +
                  '</main>';
              }
            }
          })
          .catch(function () {});
      })();
    </script>
  </body>
</html>
