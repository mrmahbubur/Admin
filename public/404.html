<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>M R S — Redirecting</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var lower = path.toLowerCase();
        var section = '';
        if (lower.indexOf('websites') !== -1) section = '#websites-section';
        else if (lower.indexOf('services') !== -1) section = '#services-section';
        else if (lower.indexOf('credentials') !== -1 || lower.indexOf('about') !== -1) section = '#about-section';
        else if (lower.indexOf('skills') !== -1) section = '#skills-section';
        else if (lower.indexOf('sponsors') !== -1) section = '#sponsors-section';
        else if (lower.indexOf('contact') !== -1) section = '#contact-section';

        var segments = path.split('/').filter(Boolean);
        if (segments.length >= 1) {
          var candidate = '/' + segments[0] + '/';
          fetch(candidate + 'index.html', { method: 'HEAD' })
            .then(function (r) {
              var target = r.ok ? candidate : '/';
              if (path !== target) {
                window.location.replace(target + section);
              }
            })
            .catch(function () {
              window.location.replace('/' + section);
            });
        } else {
          window.location.replace('/' + section);
        }
      })();
    </script>
  </head>
  <body style="background:#06090f;color:#f1f5f9;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
    <p>Redirecting to <a href="./" style="color:#3b82f6;">M R S</a>...</p>
  </body>
</html>
